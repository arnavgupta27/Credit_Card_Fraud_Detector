<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credit Card Fraud Detection</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body class="with-background">
    >
    <div class="container">
      <h1>Credit Card Fraud Detection System</h1>
      <div class="instructions">
        Enter the 29 features (comma-separated) in the text box below to analyze
        if a transaction is fraudulent.
      </div>
      <div class="input-container">
        <input type="text" id="inputData" placeholder="Enter 29 values here" />
        <div class="tooltip">Example: 0.01, 0.12, 0.23, ..., 0.28</div>
      </div>
      <button onclick="predict()">Predict</button>
    </div>

    <footer>
      <p>
        Developed by
        <b style="color: blueviolet">Arnav gupta + Sai Tribhuval Yalavali</b>>
      </p>
    </footer>

    <script>
      function predict() {
        const inputData = document.getElementById("inputData").value;
        const inputArray = inputData
          .split(",")
          .map((val) => parseFloat(val.trim()));

        fetch("/predict", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ data: inputArray }),
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.redirect) {
              window.location.href = data.redirect;
            } else {
              alert("Unexpected error. No redirect URL returned.");
            }
          })
          .catch((error) => {
            console.error("Error:", error);
            alert("An error occurred while making the prediction.");
          });
      }
    </script>
  </body>
</html>
